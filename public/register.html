<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Registration Page</title>
      <link rel="stylesheet" href="style.css">
   </head>
   <body>
      <div id="my_header">
         <header>
            <h1>Welcome to registration page</h1>
            <h3>Enter your information below</h3>
         </header> 
      </div>
      <div class="container">
      <main>
         <p>
         <form id="register">
            <p class="error"></p>
            <label for="fname">Enter your first name:</label><br>
            <input type="text" id="fname" name="fname"><br>
            <label for="lname">Enter your last name:</label><br>
            <input type="text" id="lname" name="lname"><br>
            <label for="username">Enter your username:</label><br>
            <input type="text" id="username" name="username"><br>
            <label for="pswd">Enter your password:</label><br>
            <input type="password" id="pswd" name="pswd"><br><br>
            <input type="submit" value="Register"><br><br>
         </form>
         </p>  
      
         <nav>
            
         </nav>
      </main>
      </div>
      <script type="module" src="scripts/user.js"></script>
      <script type="module" src="scripts/main.js"></script>
      
    
   </body>
   
</html>
